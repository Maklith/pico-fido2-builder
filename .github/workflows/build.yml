name: "Build"

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board to build (e.g., pico, pico2, esp32s3)
        required: true

jobs:
  # ==================== 任务 1：原有 Pico 系列板子编译 ====================
  build-pico:
    name: Build Pico (${{ inputs.board }})
    # 当手动输入的 board 不是 esp32s3 时，走原有的 Pico SDK 编译流程
    if: ${{ inputs.board != 'esp32s3' && inputs.board != 'ESP32-S3' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: librekeys/pico-fido2
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Clone and build pico-sdk
        run: |
          git clone https://github.com/raspberrypi/pico-sdk
          cd pico-sdk
          git checkout tags/2.1.1
          git submodule update --init
          cd ..

      - name: Build firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir -p build_ci
          cd build_ci
          cmake .. -DPICO_BOARD=${{ inputs.board }} -DVIDPID=Yubikey5
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico_fido2_${{ inputs.board }}
          path: build_ci/pico_fido2.uf2

  # ==================== 任务 2：ESP32-S3 编译 ====================
  build-esp32:
    name: Build ESP32 (${{ inputs.board }})
    if: ${{ inputs.board == 'esp32s3' || inputs.board == 'ESP32-S3' }}
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: librekeys/pico-fido2
          submodules: 'recursive'

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'

          . /opt/esp/idf/export.sh

          # 不要让之前手工创建的 main 组件干扰 ESP-IDF 入口
          rm -rf main build managed_components dependencies.lock sdkconfig

          # 让 ESP-IDF Component Manager 拉取 esp_tinyusb
          # 不要用 idf.py add-dependency 去创建 main/idf_component.yml
          cat > src/fido2/idf_component.yml <<'EOF'
          dependencies:
            espressif/esp_tinyusb: "*"
          EOF

          # 修复 ESP_PLATFORM 下没有把 pico-keys-sdk 源码编进 fido2 组件的问题
          python3 - <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")
          s = p.read_text()

          old = "if(NOT ESP_PLATFORM) set(SOURCES ${PICO_KEYS_SOURCES}) endif()"
          new = "set(SOURCES ${PICO_KEYS_SOURCES})"

          if old in s:
              p.write_text(s.replace(old, new))
          elif new in s:
              print("Patch already applied")
          else:
              raise SystemExit("Could not find SOURCES assignment block in CMakeLists.txt")
          PY

          idf.py set-target esp32s3
          idf.py -DVIDPID=Yubikey5 build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico_fido2_${{ inputs.board }}
          path: |
            build/**/*.bin
            build/*.bin
