name: "Build"

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board to build (e.g., pico, pico2, esp32s3)
        required: true

jobs:
  # ==================== 任务 1：原有 Pico 系列板子编译 ====================
  build-pico:
    name: Build Pico (${{ inputs.board }})
    if: ${{ inputs.board != 'esp32s3' && inputs.board != 'ESP32-S3' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: librekeys/pico-fido2
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Clone pico-sdk
        run: |
          git clone https://github.com/raspberrypi/pico-sdk
          cd pico-sdk
          git checkout tags/2.1.1
          git submodule update --init
          cd ..

      - name: Build firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir -p build_ci
          cd build_ci
          cmake .. -DPICO_BOARD=${{ inputs.board }} -DVIDPID=Yubikey5
          make -j$(nproc)

      - name: Upload Pico artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_fido2_${{ inputs.board }}
          path: build_ci/pico_fido2.uf2

  # ==================== 任务 2：ESP32-S3 编译 ====================
  build-esp32s3:
    name: Build ESP32-S3 (${{ inputs.board }})
    if: ${{ inputs.board == 'esp32s3' || inputs.board == 'ESP32-S3' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: librekeys/pico-fido2
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            wget \
            flex \
            bison \
            gperf \
            python3 \
            python3-pip \
            python3-venv \
            cmake \
            ninja-build \
            ccache \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0

      - name: Install ESP-IDF
        run: |
          git clone --recursive https://github.com/espressif/esp-idf.git
          cd esp-idf
          git checkout tags/v5.5
          git submodule update --init --recursive
          ./install.sh esp32s3

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'

          . ./esp-idf/export.sh

          rm -rf build managed_components dependencies.lock sdkconfig

          # 官方 ESP-IDF Component Manager 方法：
          # 给 fido2 组件添加 esp_tinyusb 依赖，而不是 patch CMakeLists.txt
          idf.py add-dependency --path src/fido2 "esp_tinyusb~2.0.0"

          idf.py set-target esp32s3
          idf.py -DVIDPID=Yubikey5 all

      - name: Merge ESP32-S3 flash image
        shell: bash
        run: |
          . ./esp-idf/export.sh

          mkdir -p release

          cd build
          esptool.py --chip ESP32-S3 merge_bin \
            -o ../release/pico_fido2_esp32-s3.bin \
            @flash_args

      - name: Upload ESP32-S3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_fido2_esp32-s3
          path: |
            release/pico_fido2_esp32-s3.bin
            build/**/*.bin
            build/*.bin
