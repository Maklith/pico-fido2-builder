name: "Build"

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board to build (e.g., pico, pico2, esp32s3)
        required: true

jobs:
  # ==================== 任务 1：原有 Pico 系列板子编译 ====================
  build-pico:
    name: Build Pico (${{ inputs.board }})
    # 当手动输入的 board 不是 esp32s3 时，走原有的 Pico SDK 编译流程
    if: ${{ inputs.board != 'esp32s3' && inputs.board != 'ESP32-S3' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: librekeys/pico-fido2
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Clone and build pico-sdk
        run: |
          git clone https://github.com/raspberrypi/pico-sdk
          cd pico-sdk
          git checkout tags/2.1.1
          git submodule update --init
          cd ..

      - name: Build firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir -p build_ci
          cd build_ci
          cmake .. -DPICO_BOARD=${{ inputs.board }} -DVIDPID=Yubikey5
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico_fido2_${{ inputs.board }}
          path: build_ci/pico_fido2.uf2

  # ==================== 任务 2：ESP32-S3 编译 ====================
  build-esp32:
    name: Build ESP32 (${{ inputs.board }})
    if: ${{ inputs.board == 'esp32s3' || inputs.board == 'ESP32-S3' }}
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: librekeys/pico-fido2
          submodules: 'recursive'

            - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'

          . /opt/esp/idf/export.sh

          # 清掉之前可能生成的错误 main 组件
          rm -rf main build managed_components dependencies.lock sdkconfig

          # 给 fido2 组件声明 esp_tinyusb 依赖，避免 idf.py add-dependency 自动创建 main
          mkdir -p src/fido2
          cat > src/fido2/idf_component.yml <<'EOF'
          dependencies:
            espressif/esp_tinyusb: "*"
          EOF

          # 在 ESP-IDF 调用 project() 之前，强制把 pico-keys-sdk 源码塞进 SOURCES
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("CMakeLists.txt")
          s = p.read_text()

          if "FORCE_IDF_PICO_KEYS_SOURCES" not in s:
              s, n = re.subn(
                  r"if\s*\(\s*ESP_PLATFORM\s*\)\s*project\s*\(\s*pico_fido2\s*\)\s*endif\s*\(\s*\)",
                  """if(ESP_PLATFORM)
            # FORCE_IDF_PICO_KEYS_SOURCES
            list(PREPEND SOURCES ${PICO_KEYS_SOURCES})
            list(REMOVE_DUPLICATES SOURCES)
            project(pico_fido2)
          endif()""",
                  s,
                  count=1,
              )

              if n != 1:
                  raise SystemExit("Failed to patch ESP_PLATFORM project() block")

              p.write_text(s)
          PY

          # 必须能看到这个标记，否则说明 patch 没打进去
          grep -F "FORCE_IDF_PICO_KEYS_SOURCES" CMakeLists.txt

          idf.py set-target esp32s3
          idf.py -DVIDPID=Yubikey5 reconfigure

          # 构建前验证 SDK 源码确实进入 build.ninja
          grep -R "pico-keys-sdk/src/main.c" build/build.ninja
          grep -R "pico-keys-sdk/src/fs/file.c" build/build.ninja
          grep -R "pico-keys-sdk/src/asn1.c" build/build.ninja

          idf.py -DVIDPID=Yubikey5 build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico_fido2_${{ inputs.board }}
          path: |
            build/**/*.bin
            build/*.bin
