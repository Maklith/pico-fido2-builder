name: "Build"

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board to build (e.g., pico, pico2, esp32s3)
        required: true

jobs:
  # ==================== 任务 1：原有 Pico 系列板子编译 ====================
  build-pico:
    name: Build Pico (${{ inputs.board }})
    # 当手动输入的 board 不是 esp32s3 时，走原有的 Pico SDK 编译流程
    if: ${{ inputs.board != 'esp32s3' && inputs.board != 'ESP32-S3' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: librekeys/pico-fido2
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Clone and build pico-sdk
        run: |
          git clone https://github.com/raspberrypi/pico-sdk
          cd pico-sdk
          git checkout tags/2.1.1
          git submodule update --init
          cd ..

      - name: Build firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir -p build_ci
          cd build_ci
          cmake .. -DPICO_BOARD=${{ inputs.board }} -DVIDPID=Yubikey5
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico_fido2_${{ inputs.board }}
          path: build_ci/pico_fido2.uf2

  # ==================== 任务 2：ESP32-S3 编译 ====================
  build-esp32:
    name: Build ESP32 (${{ inputs.board }})
    if: ${{ inputs.board == 'esp32s3' || inputs.board == 'ESP32-S3' }}
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: librekeys/pico-fido2
          submodules: 'recursive'

      - name: Build firmware
        run: |
          # 1. 修复 Docker 容器内 Git 提示 dubious ownership 的权限问题
          git config --global --add safe.directory '*'
          
          # 2. 激活容器内预装的 ESP-IDF 环境变量
          . /opt/esp/idf/export.sh
          
          # 3. 创建智能依赖修复型的 main 组件
          mkdir -p main
          cat << 'EOF' > main/CMakeLists.txt
          cmake_minimum_version(VERSION 3.16)
          
          # 基础已知依赖
          set(req_components fido2 tinycbor esp_tinyusb)
          
          # 动态扫描并依赖项目中可能隐式注册的所有其他 ESP-IDF 组件
          # 强迫链接器完整构建依赖链，并对静态库进行正确排序，防止未定义引用错误
          foreach(comp plat pico-keys-sdk pico_keys_sdk esp32 esp32s3 openpgp pico-openpgp pico_openpgp keys-sdk keys_sdk)
              if(TARGET __component_${comp})
                  list(APPEND req_components ${comp})
              endif()
          endforeach()
          
          idf_component_register(REQUIRES ${req_components})
          
          # 强行补充链接：如果项目通过传统 CMake 方式声明了非 IDF 标准组件库，将其强制并入主程序链接
          foreach(lib pico_keys_sdk tinycbor openpgp)
              if(TARGET ${lib})
                  target_link_libraries(__component_main PUBLIC ${lib})
              endif()
          endforeach()
          EOF
          
          # 4. 显式添加 esp_tinyusb 官方组件依赖
          idf.py add-dependency "espressif/esp_tinyusb"
          
          # 5. 设置目标芯片并执行编译
          idf.py set-target esp32s3
          idf.py build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico_fido2_${{ inputs.board }}
          path: |
            build/**/*.bin
            build/*.bin
