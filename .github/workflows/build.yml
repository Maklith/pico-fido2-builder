name: "Build"

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board to build (e.g., pico, pico2, esp32s3)
        required: true

jobs:
  # ==================== 任务 1：原有 Pico 系列板子编译 ====================
  build-pico:
    name: Build Pico (${{ inputs.board }})
    # 当手动输入的 board 不是 esp32s3 时，走原有的 Pico SDK 编译流程
    if: ${{ inputs.board != 'esp32s3' && inputs.board != 'ESP32-S3' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: librekeys/pico-fido2
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Clone and build pico-sdk
        run: |
          git clone https://github.com/raspberrypi/pico-sdk
          cd pico-sdk
          git checkout tags/2.1.1
          git submodule update --init
          cd ..

      - name: Build firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir -p build_ci
          cd build_ci
          cmake .. -DPICO_BOARD=${{ inputs.board }} -DVIDPID=Yubikey5
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico_fido2_${{ inputs.board }}
          path: build_ci/pico_fido2.uf2

  # ==================== 任务 2：ESP32-S3 编译 ====================
  build-esp32:
    name: Build ESP32 (${{ inputs.board }})
    if: ${{ inputs.board == 'esp32s3' || inputs.board == 'ESP32-S3' }}
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: librekeys/pico-fido2
          submodules: 'recursive'

      - name: Build firmware
        run: |
          # 1. 修复 Docker 容器内 Git 提示 dubious ownership 的权限问题
          git config --global --add safe.directory '*'
          
          # 2. 激活容器内预装的 ESP-IDF 环境变量
          . /opt/esp/idf/export.sh
          
          # 3. 建立一个兼容的 main 组件，并显式添加 esp_tinyusb 依赖
          mkdir -p main
          echo "idf_component_register()" > main/CMakeLists.txt
          idf.py add-dependency "espressif/esp_tinyusb"
          
          # 4. 设置目标芯片并执行编译
          idf.py set-target esp32s3
          idf.py build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico_fido2_${{ inputs.board }}
          path: |
            build/**/*.bin
            build/*.bin
